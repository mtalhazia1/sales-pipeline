# Sales Pipeline — its own site file; nothing shared with other projects except nginx itself.
limit_req_zone $binary_remote_addr zone=sales_pipeline:10m rate=10r/s;
# Anonymous auth endpoints (password login, OAuth registration/authorize/token) — a person or an MCP
# client needs a handful a day; a script hammering them gets 429s.
limit_req_zone $binary_remote_addr zone=sales_pipeline_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;          # nginx 1.24 (Ubuntu 24.04) syntax
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 4m;
    limit_req zone=sales_pipeline burst=40 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;              # MCP may stream responses
    proxy_read_timeout 300s;

    location = /api/auth/login {
        limit_req zone=sales_pipeline_auth burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ~ ^/(register|authorize|token|revoke)$ {
        limit_req zone=sales_pipeline_auth burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
